# Each module owns an Alembic branch under migrations/<module>/versions.
# Run `alembic upgrade heads` to apply core and all module branches.
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = space
# One entry per module branch. Adding a module = adding its versions folder here.
version_locations = %(here)s/migrations/core/versions

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
