<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Font substitutions for rendering Word templates with LibreOffice in the container.
     Install the real fonts (e.g. Aptos from the company's Office licence) by mounting them into
     /usr/share/fonts/custom; these aliases are only the fallback. -->
<fontconfig>
  <dir>/usr/share/fonts/custom</dir>
  <alias binding="same"><family>Segoe UI Symbol</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Aptos</family><prefer><family>Inter</family><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Times New Roman</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias binding="same"><family>Arial</family><prefer><family>Liberation Sans</family></prefer></alias>
</fontconfig>
