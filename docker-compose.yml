# Local / single-host deployment. For Kubernetes (Rancher) use deploy/helm/infra-ops.
# Required: copy .env.example to .env and set INFRAOPS_MASTER_KEYS and INFRAOPS_SIGNING_SECRET.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: infraops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-infraops}
      POSTGRES_DB: infraops
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infraops"]
      interval: 5s
      retries: 10

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "heads"]
    env_file: .env
    environment:
      INFRAOPS_DATABASE_URL: postgresql+asyncpg://infraops:${POSTGRES_PASSWORD:-infraops}@db:5432/infraops
    depends_on:
      db: { condition: service_healthy }

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      INFRAOPS_DATABASE_URL: postgresql+asyncpg://infraops:${POSTGRES_PASSWORD:-infraops}@db:5432/infraops
    volumes:
      - files:/data/files          # templates, generated PDFs, signed scans
      # - ./fonts:/usr/share/fonts/custom:ro   # optional: company fonts (e.g. Aptos)
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    volumes:
      - files:/data/files          # workflow steps read/write the same files as the api
      # - ./fonts:/usr/share/fonts/custom:ro   # optional: company fonts (e.g. Aptos)
    healthcheck:
      disable: true   # the image healthcheck probes the API port; the worker serves no HTTP
    env_file: .env
    environment:
      INFRAOPS_DATABASE_URL: postgresql+asyncpg://infraops:${POSTGRES_PASSWORD:-infraops}@db:5432/infraops
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build: ./frontend
    restart: unless-stopped
    # HTTP on 80 and HTTPS on 443. Put the certificate in ./certs (tls.crt = full chain, tls.key);
    # without it only HTTP is served. Behind another reverse proxy: INFRAOPS_HTTP_BIND=127.0.0.1:8080.
    ports:
      - "${INFRAOPS_HTTP_BIND:-80}:8080"
      - "${INFRAOPS_HTTPS_BIND:-443}:8443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on: [api]

volumes:
  db-data:
  files:
