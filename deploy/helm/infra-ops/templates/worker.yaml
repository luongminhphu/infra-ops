apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "infraops.name" . }}-worker
  labels: {{- include "infraops.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: worker }
  template:
    metadata:
      labels: {{- include "infraops.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: "{{ .Values.image.api.repository }}:{{ .Values.image.api.tag }}"
          imagePullPolicy: {{ .Values.image.api.pullPolicy }}
          command: ["python", "-m", "app.worker"]
          envFrom: [{ secretRef: { name: {{ .Values.existingSecret }} } }]
          env: {{- include "infraops.env" . | nindent 12 }}
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
          {{- include "infraops.podSecurity" . | nindent 10 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: files, mountPath: /data/files }
            {{- if .Values.fontsSecret }}
            - { name: fonts, mountPath: /usr/share/fonts/custom, readOnly: true }
            {{- end }}
            {{- if .Values.internalCaConfigMap }}
            - { name: ca, mountPath: /etc/infraops/ca }
            {{- end }}
      volumes:
        - { name: tmp, emptyDir: {} }
        - name: files
          persistentVolumeClaim: { claimName: {{ .Values.storage.existingClaim | default (printf "%s-files" (include "infraops.name" .)) }} }
        {{- if .Values.fontsSecret }}
        - name: fonts
          secret: { secretName: {{ .Values.fontsSecret }} }
        {{- end }}
        {{- if .Values.internalCaConfigMap }}
        - name: ca
          configMap: { name: {{ .Values.internalCaConfigMap }}, items: [{ key: ca.crt, path: ca-bundle.crt }] }
        {{- end }}
