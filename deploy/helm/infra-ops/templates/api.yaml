apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "infraops.name" . }}-api
  labels: {{- include "infraops.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api }
  template:
    metadata:
      labels: {{- include "infraops.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.image.api.repository }}:{{ .Values.image.api.tag }}"
          imagePullPolicy: {{ .Values.image.api.pullPolicy }}
          ports: [{ name: http, containerPort: 8000 }]
          envFrom: [{ secretRef: { name: {{ .Values.existingSecret }} } }]
          env: {{- include "infraops.env" . | nindent 12 }}
          readinessProbe: { httpGet: { path: /health/ready, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health/live, port: http }, periodSeconds: 20 }
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          {{- include "infraops.podSecurity" . | nindent 10 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- if .Values.internalCaConfigMap }}
            - { name: ca, mountPath: /etc/infraops/ca }
            {{- end }}
      volumes:
        - { name: tmp, emptyDir: {} }
        {{- if .Values.internalCaConfigMap }}
        - name: ca
          configMap: { name: {{ .Values.internalCaConfigMap }}, items: [{ key: ca.crt, path: ca-bundle.crt }] }
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels: {{- include "infraops.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api }
  ports: [{ name: http, port: 8000, targetPort: http }]
